name: Release cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    uses: yasyf/homebrew-tap/.github/workflows/go-release-cache.yml@12c82844c146643f7d8d1fdf6aca69918ea4f7a8
    with:
      runner: macos-latest
      pre-build: |
        brew install zig@0.15 cmake
        echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
        echo "LIBGHOSTTY_ROOT=$GITHUB_WORKSPACE/.libghostty" >> "$GITHUB_ENV"
        echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
