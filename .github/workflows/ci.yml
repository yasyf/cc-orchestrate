name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  # Pure-Go path (CGO_ENABLED=0 → the charmbracelet/x/vt grid). Fast, no toolchain;
  # covers all logic plus the x/vt grid. The cgo/go-libghostty grid has its own job.
  build:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      # The plugin manifest and the binrun descriptor must pin the same version
      # (the marketplace serves plugin.json; the MCP server resolves bin/cco.binrun).
      - name: Assert plugin manifest and descriptor agree on version
        run: |
          manifest="$(jq -r .version plugins/cc-orchestrate/.claude-plugin/plugin.json)"
          descriptor="$(tail -n +2 plugins/cc-orchestrate/bin/cco.binrun | jq -r .version.static)"
          test "$manifest" = "$descriptor" \
            || { echo "version drift: plugin.json=$manifest descriptor=$descriptor" >&2; exit 1; }

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # The pure-Go suite on linux, where the daemon runs under daemonkit's foreground
  # supervisor and same-user trust instead of a signed LaunchAgent.
  linux:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # The linux release binary exactly as .goreleaser.yaml builds it: libghostty-vt
  # for x86_64-linux-musl and a fully static cgo link through zig cc.
  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Download Go modules
        run: go mod download

      - name: Build native libghostty-vt
        run: echo "PKG_CONFIG_PATH=$(scripts/build-libghostty.sh linux-amd64 x86_64-linux-musl)" >> "$GITHUB_ENV"

      - name: go build (static musl)
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS_ALLOW: '.*\.a$'
          CC: zig cc -target x86_64-linux-musl
          CXX: zig c++ -target x86_64-linux-musl
        run: go build -ldflags "-X github.com/yasyf/cc-orchestrate/orchestrate.Version=0.0.0-ci" -o cc-orchestrate .

      - name: Smoke the supervised daemon, CLI, and MCP channel
        run: |
          if ./cc-orchestrate config list > refusal.txt 2>&1; then exit 1; fi
          grep 'no supervisor is running' refusal.txt
          ./cc-orchestrate supervise &
          supervisor=$!
          for _ in $(seq 100); do
            [ -S "$HOME/.daemonkit/a/com.yasyf.cc-orchestrate/sv.sock" ] && break
            sleep 0.1
          done
          ./cc-orchestrate config list
          status="$(./cc-orchestrate status)"
          grep -q 'daemon: running (0.0.0-ci)' <<<"$status"
          initialize='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          reply="$(printf '%s\n' "$initialize" | ./cc-orchestrate channel)"
          grep -q '"claude/channel"' <<<"$reply"
          ./cc-orchestrate stop
          kill -TERM "$supervisor"
          wait "$supervisor"

  # Real-tmux integration test. CGO_ENABLED=1 because -race requires cgo; ./backend
  # imports no libghostty, so a plain C toolchain suffices (no native libghostty build).
  integration:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tmux
        run: brew install tmux

      - name: go test (integration)
        run: go test -race -run Integration ./backend/

  # cgo/go-libghostty path (the default for release binaries). Builds libghostty-vt
  # natively and runs the full -race suite (race requires cgo; orchestrate links the
  # libghostty-vt grid), so grid_cgo.go and data races can't regress unnoticed.
  cgo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Homebrew's zig@0.15, not upstream 0.15.2: upstream cannot link the
      # Xcode SDK (ziglang/zig#31658), and release.yml already builds this same
      # library through the patched formula.
      - name: Install cmake and Zig 0.15
        run: |
          brew install zig@0.15 cmake
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"

      # build-libghostty.sh resolves the pinned ghostty source via
      # `go list -m -f '{{.Dir}}'`, which is empty unless the module is extracted —
      # download modules first so a cold setup-go cache can't break `cmake -S`.
      - name: Download Go modules
        run: go mod download

      - name: Build native libghostty-vt
        run: echo "PKG_CONFIG_PATH=$(scripts/build-libghostty.sh macos-arm64 aarch64-macos)" >> "$GITHUB_ENV"

      - name: go build + test -race (cgo)
        env:
          CGO_ENABLED: "1"
        run: go build ./... && go test -race ./...

  lint:
    runs-on: macos-latest
    # Lint the pure-Go path (CGO_ENABLED=0): the cgo grid (grid_cgo.go, //go:build
    # cgo) needs a natively-built libghostty-vt that the cgo job provides; here it is
    # excluded by build tag so the linter type-checks without the native dep.
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Pinned, not `latest`: an upstream golangci-lint release turns this job red
      # with no code change here, on a schedule nobody controls. That is how main
      # sat red from 2026-08-17 to 2026-08-29 and how #1 merged over a failing
      # check. Bump this deliberately, and reformat in the same commit — the
      # gofumpt bundled with a newer version wants
      # orchestrate/{adoptops,cli,render,spawn}.go split differently.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  vuln:
    runs-on: macos-latest
    # Scan the pure-Go path (CGO_ENABLED=0) so govulncheck need not link the native
    # libghostty-vt the cgo grid imports; the build-tagged cgo file is excluded.
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
